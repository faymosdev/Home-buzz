# Keeps the free-tier Supabase project from being paused for inactivity by calling the
# site's protected keep-alive endpoint once a day. Runs on GitHub, so every run is visible
# under the repo's Actions tab and can be started manually with "Run workflow".
#
# Needs a repository secret named CRON_SECRET with the same value as the CRON_SECRET
# environment variable in Vercel (Production).
name: Supabase keep-alive

on:
  schedule:
    - cron: "23 5 * * *" # daily at 05:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep-alive endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."
            exit 1
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://www.homebuzzgroups.co.uk/api/cron/keep-alive)
          echo "HTTP $status: $(cat response.json)"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive returned HTTP $status"
            exit 1
          fi
